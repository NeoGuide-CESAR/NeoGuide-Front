# =============================================================================
# NeoGuide-Front — Orquestração Docker Compose (Angular + Nginx Proxy Reverso)
# =============================================================================

services:
  neoguide-front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neoguide-front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-80}:80"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
