<app-site-header [links]="links"><a class="usuario" routerLink="/inicio"><span class="ms" aria-hidden="true">account_circle</span>{{ auth.usuario()?.nome || 'Meu perfil' }}<span class="ms" aria-hidden="true">expand_more</span></a></app-site-header>

<app-wizard-body
  titulo="Novo projeto"
  subtitulo="Comece pelos dados da edificação. As próximas etapas dependem do que você marcar aqui."
  [breadcrumb]="breadcrumbWizard()"
  [dadosIniciais]="dados()"
  [complementosIniciais]="complementos()"
  [edicao]="edicao()"
  [salvando]="salvando()"
  [erroSalvamento]="erro()"
  [mensagemSalvamento]="mensagem()"
  (salvarProjeto)="salvar($event)"
  (rascunhoAlterado)="salvarAutomatico($event)"
  (cancelar)="cancelar()"
  (concluir)="concluir()"
/>
<app-site-footer />
